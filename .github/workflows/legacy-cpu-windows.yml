name: OpenCode 2 - Legacy CPU Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: OpenCode version
        required: true
        default: "2.2.5"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout OpenCode source
        uses: actions/checkout@v4
        with:
          repository: anomalyco/opencode
          ref: v${{ inputs.version }}

      - name: Use Node runtime with Windows libuv shutdown fix
        run: |
          sed -i 's/const NODE_VERSION = "26.4.0"/const NODE_VERSION = "26.13.0"/' packages/cli/script/build-node.ts
          grep -F 'const NODE_VERSION = "26.13.0"' packages/cli/script/build-node.ts

      - name: Install dependencies and Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.4.0"

      - name: Build app archive
        run: |
          bun packages/cli/script/build-node.ts \
            --app-archive-only \
            --skip-install
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_APP_ARCHIVE: .cache/app-archive.bin

      - name: Build Windows Node executable
        run: |
          bun packages/cli/script/build-node.ts \
            --skip-install \
            --outdir=dist/node
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_APP_ARCHIVE: .cache/app-archive.bin
          OPENCODE_TARGET: windows-x64

      - name: Test executable
        run: |
          ./packages/cli/dist/node/cli-node-windows-x64/bin/opencode2-node.exe --version
          ./packages/cli/dist/node/cli-node-windows-x64/bin/opencode2-node.exe --help

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: opencode2-node-windows-x64
          path: packages/cli/dist/node/cli-node-windows-x64/
          if-no-files-found: error